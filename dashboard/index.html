class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  componentDidCatch(err) { if (window.console) console.error(err); }
  render() {
    if (this.state.err) return html`<div className="empty"><p className="disp">Something went wrong here</p><p>${String((this.state.err && this.state.err.message) || this.state.err)}</p><button type="button" className="btn" onClick=${() => this.setState({ err: null })}>Try again</button></div>`;
    return this.props.children;
  }
}

function App() {
  const caps = useCaps();
  const db = caps.status === 'ready' ? caps.db : null;
  const st = useStore(db);
  const route = useRoute();
  const [toasts, setToasts] = useState([]);
  const [drawer, setDrawer] = useState(null);
  const [palette, setPalette] = useState(false);
  const [me, setMe] = useState(null);
  const [writable, setWritable] = useState(null);
  const [blocked, setBlocked] = useState(false);
  const [demoPref, setDemoPrefState] = useState(() => local.get('demo', 'auto'));
  const [aiOff, setAiOff] = useState(false);
  const [settled, setSettled] = useState(false);
  const [timedOut, setTimedOut] = useState(false);
  const pruned = useRef(false);
  const chains = useRef(new Map());
  const lastSteps = useRef(new Map());
  const drawerRef = useRef(null); drawerRef.current = drawer;

  const toast = (text, opts) => {
    const id = Math.random().toString(36).slice(2);
    const t = Object.assign({ id, text }, opts || {});
    setToasts((l) => l.slice(-2).concat([t]));
    setTimeout(() => setToasts((l) => l.filter((x) => x.id !== id)), (opts && opts.actions) ? 7000 : 3400);
  };
  const dismiss = (id) => setToasts((l) => l.filter((x) => x.id !== id));
  const setDemoPref = (v) => { setDemoPrefState(v); local.set('demo', v); };

  useEffect(() => {
    if (!caps.user) return undefined;
    let alive = true;
    Promise.resolve().then(() => caps.user.me()).then((v) => { if (alive) setMe(v || null); }).catch(() => {});
    Promise.resolve().then(() => caps.user.can('data.write')).then((v) => { if (alive) setWritable(v === undefined ? null : v); }).catch(() => {});
    return () => { alive = false; };
  }, [caps.user]);

  useEffect(() => {
    if (!db) return undefined;
    const tm = setTimeout(() => setTimedOut(true), 9000);
    return () => clearTimeout(tm);
  }, [db]);
  const loadedAll = !!db && COLLECTIONS.every((c) => st.loaded[c]);
  const liveAll = !!db && COLLECTIONS.every((c) => st.live[c]);
  useEffect(() => {
    if (!loadedAll || liveAll) return undefined;
    const tm = setTimeout(() => setSettled(true), 3500);
    return () => clearTimeout(tm);
  }, [loadedAll, liveAll]);
  const real = st.data;
  const realRef = useRef(real); realRef.current = real;
  const realTotal = COLLECTIONS.reduce((a, c) => a + real[c].length, 0);
  const noRuntime = caps.status === 'none' || (caps.status === 'ready' && !caps.db);
  const booting = caps.status === 'loading' || (!!db && !timedOut && (!loadedAll || (realTotal === 0 && !(liveAll || settled))));
  const stalled = !!db && timedOut && !loadedAll;
  const demo = !booting && (noRuntime || (realTotal === 0 && demoPref !== 'off'));
  setCurrency((st.settings && st.settings.currency) || 'EUR');
  const demoData = useMemo(() => makeDemo(), [today()]);
  const D = demo ? demoData : Object.assign({}, real, { activity: st.activity });
  const readOnly = writable === false || blocked;
  const canCreate = !!db && !readOnly;
  const canEditRecord = (r) => !!db && !readOnly && !(r && r.demo);

  useEffect(() => {
    if (!db || readOnly || writable === false || pruned.current || !loadedAll) return;
    pruned.current = true;
    const cutoff = new Date(Date.now() - 60 * 864e5).toISOString();
    Promise.resolve().then(() => db.collection('activity').where('at', '<', cutoff).limit(50).get()).then(async (snap) => {
      for (const doc of snap.docs) { try { await db.collection('activity').doc(doc.id).delete(); } catch (e) { break; } }
    }).catch(() => {});
  }, [db, loadedAll, readOnly, writable]);

  const ids = useMemo(() => {
    const s = new Set();
    (D.tasks || []).forEach((k) => { if (k.assignee) s.add(k.assignee); });
    (D.activity || []).forEach((a) => { if (a.by) s.add(a.by); });
    if (me && me.id) s.add(me.id);
    return Array.from(s);
  }, [D, me]);
  const profiles = useProfiles(caps.user, ids);
  const personName = (id) => {
    if (!id) return 'Unassigned';
    if (me && id === me.id) return me.name || 'You';
    const p = profiles[id];
    return (p && p.name) || 'Someone';
  };
  const clientMap = useMemo(() => { const mm = new Map(); D.clients.forEach((c) => mm.set(c.id, c)); return mm; }, [D.clients]);
  const clientName = (cid) => (cid && clientMap.get(cid) ? clientMap.get(cid).name : '');
  const meId = (me && me.id) || null;

  /* ---- writing ---- */
  const fail = async (e, updatedPath) => {
    const code = e && e.code;
    if (code === 'invalid_argument' && updatedPath) {
      let exists = true;
      try { exists = (await db.doc(updatedPath).get()).exists; } catch (x) { /* assume it is still there */ }
      if (!exists) { toast('Someone else deleted this record.'); return false; }
    }
    if (code === 'invalid_argument') { setBlocked(true); toast('This dashboard is view-only for you. Ask the owner for edit access.'); }
    else if (code === 'quota_exceeded') toast('The dashboard is full. Delete old records to add new ones.');
    else if (code === 'resource_exhausted') toast('Too many changes at once. Wait a moment and try again.');
    else if (code === 'revoked' || code === 'not_granted' || code === 'capability_disabled' || code === 'capability_removed') toast('Your access to this dashboard changed. Reload the page.');
    else toast('Couldn’t save. Check your connection and try again.');
    return false;
  };
  const inTurn = (path, task) => {
    if (!path) return task();
    const prev = chains.current.get(path) || Promise.resolve();
    const next = prev.then(task, task);
    chains.current.set(path, next);
    next.then(() => { if (chains.current.get(path) === next) chains.current.delete(path); });
    return next;
  };
  const write = (fn, path, isUpdate) => inTurn(path, async () => {
    try { await fn(); return true; } catch (e) {
      if (e && e.code === 'unavailable') {
        await new Promise((r) => setTimeout(r, 300 + Math.random() * 700));
        try { await fn(); return true; } catch (e2) { return fail(e2, isUpdate ? path : null); }
      }
      return fail(e, isUpdate ? path : null);
    }
  });
  const guardWrite = (creating) => {
    if (!db) { toast('Open this dashboard in Claude to save records.'); return false; }
    if (readOnly) { toast('This dashboard is view-only for you.'); return false; }
    if (creating && demo) { setDemoPref('off'); }
    return true;
  };
  const log = (text, ref) => {
    if (!db || !text) return;
    try { db.collection('activity').doc(newId('a')).set({ at: isoNow(), by: meId, text, ref: ref || null }).catch(() => {}); } catch (e) { /* activity is best effort */ }
  };
  const create = async (col, body, logText) => {
    if (!guardWrite(true)) return null;
    const id = newId(col.charAt(0));
    const doc = clean(Object.assign({}, body, { createdAt: body.createdAt || isoNow(), updatedAt: isoNow(), createdBy: meId }));
    const ok = await write(() => db.collection(col).doc(id).set(doc), col + '/' + id);
    if (ok && logText) log(logText, { col, id });
    return ok ? id : null;
  };
  const patch = async (col, id, body, logText) => {
    if (!guardWrite(false)) return false;
    const ok = await write(() => db.collection(col).doc(id).update(clean(Object.assign({}, body, { updatedAt: isoNow() }))), col + '/' + id, true);
    if (ok && logText) log(logText, { col, id });
    return ok;
  };
  const put = async (col, id, body, logText) => {
    if (!guardWrite(true)) return false;
    const ok = await write(() => db.collection(col).doc(id).set(clean(body)), col + '/' + id);
    if (ok && logText) log(logText, { col, id });
    return ok;
  };
  const remove = async (col, id, logText) => {
    if (!guardWrite(false)) return false;
    const ok = await write(() => db.collection(col).doc(id).delete(), col + '/' + id);
    if (ok && logText) log(logText, { col, id });
    return ok;
  };
  const restore = (col, id, data) => write(() => db.collection(col).doc(id).set(clean(data)), col + '/' + id).then((ok) => { if (ok) toast('Restored'); });
  const changeSteps = (c, change) => {
    if (!guardWrite(false)) return Promise.resolve(false);
    const path = 'clients/' + c.id;
    return write(async () => {
      const snap = realRef.current.clients.find((x) => x.id === c.id);
      const mine = lastSteps.current.get(c.id);
      const base = mine && (!snap || String(snap.updatedAt || '') <= mine.at) ? mine.steps : ((snap || c).steps || []);
      const steps = change(base), at = isoNow();
      await db.collection('clients').doc(c.id).update({ steps, updatedAt: at });
      lastSteps.current.set(c.id, { steps, at });
    }, path, true);
  };

  const download = async (filename, data) => {
    if (!caps.downloads) { toast('Downloads are available when the dashboard is open in Claude.'); return; }
    try { await caps.downloads.save({ filename, data }); }
    catch (e) {
      const code = e && e.code;
      if (code === 'declined') return;
      if (code === 'rate_limited') toast('Another download is waiting for you. Try again in a moment.');
      else toast('That download isn’t available here.');
    }
  };
  const stamp = today();

  const actions = {
    async createLead(body) { const id = await create('leads', body, 'added lead ' + body.business); if (id) toast('Lead added'); return id; },
    async updateLead(l, body, quiet) {
      const moved = body.stage && body.stage !== l.stage;
      const b = Object.assign({}, body);
      if (moved && b.stage === 'won' && !l.wonAt) b.wonAt = isoNow();
      const ok = await patch('leads', l.id, b, moved ? 'moved ' + (b.business || l.business) + ' to ' + stageLabel(b.stage) : null);
      if (ok && !quiet) toast(moved ? 'Moved to ' + stageLabel(b.stage) : 'Lead saved', moved && b.stage === 'won' && !l.clientId ? { actions: [{ label: 'Make client', run: () => actions.convertLead(Object.assign({}, l, b)) }] } : null);
      return ok;
    },
    async moveLead(l, stage) {
      if (l.demo) { toast('Sample leads can’t be moved. Add your own lead to start.'); return; }
      const prev = { stage: l.stage, wonAt: l.wonAt || null };
      const b = { stage }; if (stage === 'won' && !l.wonAt) b.wonAt = isoNow();
      const ok = await patch('leads', l.id, b, 'moved ' + l.business + ' to ' + stageLabel(stage));
      if (ok) {
        const acts = [{ label: 'Undo', run: () => patch('leads', l.id, prev, null) }];
        if (stage === 'won' && !l.clientId) acts.push({ label: 'Make client', run: () => actions.convertLead(Object.assign({}, l, b)) });
        toast('Moved to ' + stageLabel(stage), { actions: acts });
      }
    },
    async convertLead(l) {
      if (l.demo) { toast('Sample leads can’t be converted. Add your own lead to start.'); return null; }
      const services = (l.services || []).slice();
      const cid = await create('clients', { name: l.business, type: l.type || null, city: l.city || '', contact: l.contact || '', email: l.email || '', phone: l.phone || '', instagram: l.instagram || '', website: '', services, phase: 'discover', status: 'active', retainer: l.valueMonthly || null, startDate: today(), notes: l.notes || '', steps: makeSteps(services), leadId: l.id }, 'turned ' + l.business + ' into a client');
      if (!cid) return null;
      await patch('leads', l.id, { stage: 'won', wonAt: l.wonAt || isoNow(), clientId: cid }, null);
      toast(l.business + ' is now a client');
      go('client-' + cid);
      return cid;
    },
    async removeLead(l) {
      const data = Object.assign({}, l);
      const ok = await remove('leads', l.id, 'deleted lead ' + l.business);
      if (ok) toast('Lead deleted', { actions: [{ label: 'Undo', run: () => restore('leads', l.id, data) }] });
      return ok;
    },
    async createClient(body) {
      const id = await create('clients', Object.assign({}, body, { steps: makeSteps(body.services) }), 'added client ' + body.name);
      if (id) toast('Client added');
      return id;
    },
    async updateClient(c, body) {
      const b = Object.assign({}, body);
      const added = (body.services || []).filter((s) => (c.services || []).indexOf(s) < 0);
      if (added.length) {
        const have = new Set((c.steps || []).map((s) => s.phase + '|' + s.text));
        const extra = makeSteps(added).filter((s) => STEP_TEMPLATES.some((t) => t[2] === s.text && t[1] && added.indexOf(t[1]) >= 0) && !have.has(s.phase + '|' + s.text));
        if (extra.length) b.steps = (c.steps || []).concat(extra);
      }
      const ok = await patch('clients', c.id, b, body.phase !== c.phase ? 'moved ' + body.name + ' to ' + phaseLabel(body.phase) : null);
      if (ok) toast('Client saved');
      return ok;
    },
    async setPhase(c, phase) {
      const prev = c.phase;
      const ok = await patch('clients', c.id, { phase }, 'moved ' + c.name + ' to ' + phaseLabel(phase));
      if (ok) toast(c.name + ' is in ' + phaseLabel(phase), { actions: [{ label: 'Undo', run: () => patch('clients', c.id, { phase: prev }, null) }] });
    },
    toggleStep(c, sid) { return changeSteps(c, (steps) => steps.map((s) => (s.id === sid ? Object.assign({}, s, { done: !s.done }) : s))); },
    addStep(c, phase, text) { return changeSteps(c, (steps) => steps.concat([{ id: newId('s'), phase, text, done: false }])); },
    removeStep(c, sid) { return changeSteps(c, (steps) => steps.filter((s) => s.id !== sid)); },
    async removeClient(c, alsoRelated) {
      const ok = await remove('clients', c.id, 'deleted client ' + c.name);
      if (ok && alsoRelated) {
        const tk = real.tasks.filter((k) => k.clientId === c.id), rs = real.results.filter((r) => r.clientId === c.id);
        for (const k of tk) await write(() => db.collection('tasks').doc(k.id).delete(), 'tasks/' + k.id);
        for (const r of rs) await write(() => db.collection('results').doc(r.id).delete(), 'results/' + r.id);
      }
      if (ok) toast('Client deleted');
      return ok;
    },
    async createTask(body) { const id = await create('tasks', body, 'added task “' + body.title + '”'); if (id) toast('Task added'); return id; },
    async updateTask(k, body) {
      const finished = body.status === 'done' && k.status !== 'done';
      const ok = await patch('tasks', k.id, body, finished ? 'completed “' + body.title + '”' : null);
      if (ok) toast('Task saved');
      return ok;
    },
    async toggleTask(k) {
      if (k.demo) { toast('Sample tasks can’t be changed. Add your own task to start.'); return; }
      const done = k.status !== 'done';
      await patch('tasks', k.id, { status: done ? 'done' : 'todo', doneAt: done ? isoNow() : null }, done ? 'completed “' + k.title + '”' : null);
    },
    async removeTask(k) {
      const data = Object.assign({}, k);
      const ok = await remove('tasks', k.id, null);
      if (ok) toast('Task deleted', { actions: [{ label: 'Undo', run: () => restore('tasks', k.id, data) }] });
      return ok;
    },
    async createInvoice(body) { const id = await create('invoices', body, 'created invoice ' + body.number + ' for ' + body.clientName); if (id) toast('Invoice created'); return id; },
    async updateInvoice(i, body) {
      const paidNow = body.status === 'paid' && i.status !== 'paid';
      const ok = await patch('invoices', i.id, body, paidNow ? 'marked invoice ' + body.number + ' paid' : null);
      if (ok) toast('Invoice saved');
      return ok;
    },
    async markSent(i) { const ok = await patch('invoices', i.id, { status: 'sent' }, 'marked invoice ' + i.number + ' sent'); if (ok) toast(i.number + ' marked sent'); },
    async markPaid(i) {
      const ok = await patch('invoices', i.id, { status: 'paid', paidOn: today() }, 'marked invoice ' + i.number + ' paid');
      if (ok) toast(i.number + ' marked paid', { actions: [{ label: 'Undo', run: () => patch('invoices', i.id, { status: i.status, paidOn: i.paidOn || null }, null) }] });
    },
    async removeInvoice(i) {
      const data = Object.assign({}, i);
      const ok = await remove('invoices', i.id, 'deleted invoice ' + i.number);
      if (ok) toast('Invoice deleted', { actions: [{ label: 'Undo', run: () => restore('invoices', i.id, data) }] });
      return ok;
    },
    async createRetainerDrafts() {
      const mk = thisMonth();
      const need = real.clients.filter((c) => c.status === 'active' && c.retainer > 0 && !real.invoices.some((i) => i.clientId === c.id && i.kind === 'retainer' && i.period === mk));
      if (!need.length) { toast('Every active retainer already has an invoice for ' + fmtMonthName(mk) + '.'); return; }
      if (!guardWrite(true)) return;
      const iss = today(); let seq = nextInvoiceSeq(real.invoices, iss); let made = 0;
      for (const c of need) {
        const id = await create('invoices', { number: invoiceNo(iss.slice(0, 4), seq), clientId: c.id, clientName: c.name, kind: 'retainer', period: mk, description: fmtMonthName(mk) + ' retainer', amount: c.retainer, issued: iss, due: addDays(iss, 14), status: 'draft', paidOn: null, notes: '' }, null);
        if (!id) break; seq += 1; made += 1;
      }
      if (made) { log('drafted ' + made + (made === 1 ? ' retainer invoice' : ' retainer invoices') + ' for ' + fmtMonthName(mk)); toast(made + (made === 1 ? ' draft invoice created' : ' draft invoices created')); }
    },
    async saveResult(c, month, body, existing) {
      if (!c) return false;
      const id = c.id + '--' + month;
      const doc = Object.assign({}, existing ? clean(existing) : {}, body, { clientId: c.id, month, updatedAt: isoNow() });
      if (!existing) { doc.createdAt = isoNow(); doc.createdBy = meId; }
      const ok = await put('results', id, doc, 'saved ' + fmtMonth(month, true) + ' results for ' + c.name);
      if (ok) toast(fmtMonthName(month) + ' results saved');
      return ok;
    },
    async saveSummary(r, text) { if (!r) return; const ok = await patch('results', r.id, { summary: text.trim() }, null); if (ok) toast('Summary saved'); },
    async removeResult(r, c) { const ok = await remove('results', r.id, 'deleted ' + fmtMonth(r.month, true) + ' results for ' + (c ? c.name : 'a client')); if (ok) toast('Month deleted'); return ok; },
    async saveGrowth(month, body, existing) {
      const doc = Object.assign({}, existing ? clean(existing) : {}, body, { month, updatedAt: isoNow() });
      if (!existing) { doc.createdAt = isoNow(); doc.createdBy = meId; }
      const ok = await put('growth', month, doc, 'saved ' + fmtMonth(month, true) + ' numbers for North Frame');
      if (ok) toast(fmtMonthName(month) + ' numbers saved');
      return ok;
    },
    async removeGrowth(g) { const ok = await remove('growth', g.id, null); if (ok) toast('Month deleted'); return ok; },
    async saveSettings(p) {
      if (!db) { toast('Open this dashboard in Claude to change settings.'); return; }
      if (readOnly) { toast('This dashboard is view-only for you.'); return; }
      const ok = await write(() => db.doc('settings/main').set(clean(Object.assign({}, st.settings || {}, p, { updatedAt: isoNow() }))), 'settings/main');
      if (ok) toast('Saved');
    },
    exportCsv(kind) {
      const R = real;
      const cname = (cid) => { const c = R.clients.find((x) => x.id === cid); return c ? c.name : ''; };
      const svc = (l) => (l || []).map((s) => (SERVICES.find((x) => x.key === s) || {}).label || s);
      const sets = {
        leads: [R.leads, [['Business', (l) => l.business], ['Stage', (l) => stageLabel(l.stage)], ['Type', (l) => l.type], ['City', (l) => l.city], ['Contact', (l) => l.contact], ['Email', (l) => l.email], ['Phone', (l) => l.phone], ['Instagram', (l) => l.instagram], ['Source', (l) => l.source], ['Interested in', (l) => svc(l.services)], ['Monthly value', (l) => l.valueMonthly], ['One-off value', (l) => l.valueOneOff], ['Next step', (l) => l.nextStep], ['Next step by', (l) => l.nextDate], ['Lost reason', (l) => l.lostReason], ['Notes', (l) => l.notes], ['Added', (l) => isoDay(l.createdAt)]]],
        clients: [R.clients, [['Client', (c) => c.name], ['Status', (c) => statusLabel(c.status)], ['Phase', (c) => phaseLabel(c.phase)], ['Type', (c) => c.type], ['City', (c) => c.city], ['Services', (c) => svc(c.services)], ['Monthly retainer', (c) => c.retainer], ['Client since', (c) => c.startDate], ['Contact', (c) => c.contact], ['Email', (c) => c.email], ['Phone', (c) => c.phone], ['Instagram', (c) => c.instagram], ['Website', (c) => c.website], ['Notes', (c) => c.notes]]],
        tasks: [R.tasks, [['Task', (k) => k.title], ['Status', (k) => k.status], ['Priority', (k) => k.priority], ['Client', (k) => cname(k.clientId)], ['Due', (k) => k.due], ['Assigned to', (k) => (k.assignee ? personName(k.assignee) : '')], ['Done on', (k) => isoDay(k.doneAt)], ['Notes', (k) => k.notes]]],
        invoices: [R.invoices, [['Number', (i) => i.number], ['Client', (i) => cname(i.clientId) || i.clientName], ['Type', (i) => i.kind], ['Month covered', (i) => i.period], ['Description', (i) => i.description], ['Amount (' + CUR + ')', (i) => i.amount], ['Issued', (i) => i.issued], ['Due', (i) => i.due], ['Status', (i) => INV_STATE_LABEL[invoiceState(i)]], ['Paid on', (i) => i.paidOn], ['Notes', (i) => i.notes]]],
        results: [R.results, [['Client', (r) => cname(r.clientId)], ['Month', (r) => r.month]].concat(RESULT_FIELDS.map((f) => [f.label, (r) => r[f.key]])).concat([['Summary', (r) => r.summary]])],
        growth: [R.growth, [['Month', (g) => g.month]].concat(GROWTH_FIELDS.map((f) => [f.label, (g) => g[f.key]])).concat([['Notes', (g) => g.notes]])],
      };
      const set = sets[kind]; if (!set) return;
      if (!set[0].length) { toast('Nothing to export yet.'); return; }
      download('north-frame-' + kind + '-' + stamp + '.csv', toCsv(set[0], set[1]));
    },
    exportBackup() {
      const out = { app: 'North Frame HQ', exportedAt: isoNow(), currency: CUR };
      COLLECTIONS.forEach((c) => { out[c] = real[c]; });
      download('north-frame-backup-' + stamp + '.json', JSON.stringify(out, null, 2));
    },
    downloadReport(c, month) {
      const rows = D.results.filter((r) => r.clientId === c.id);
      const p = document.querySelector('#logo-nf path');
      const htmlDoc = buildReportHtml(c, month, rows, p ? p.getAttribute('d') : '');
      const slug = String(c.name || 'client').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'client';
      download(slug + '-results-' + month + '.html', htmlDoc);
    },
  };

  const sample = caps.sample;
  const ai = sample && !aiOff ? {
    async parseEnquiry(text, signal) {
      const v = await sample.json(ENQUIRY_PROMPT + '\n\nMessage:\n"""\n' + text.slice(0, 12000) + '\n"""', { modelTier: 'quick', signal });
      return normalizeLead(v);
    },
    draftReply(l, onText, signal, fresh) {
      const opts = { onText, signal }; if (fresh) opts.cache = false;
      return sample(replyPrompt(l, me && me.name), opts);
    },
    summary(c, month, cur, prev, onText, signal, fresh) {
      const opts = { onText, signal }; if (fresh) opts.cache = false;
      return sample(summaryPrompt(c, month, cur, prev), opts);
    },
  } : null;
  const aiError = (e) => {
    const code = e && e.code;
    if (code === 'cancelled') return null;
    if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].indexOf(code) >= 0) { setAiOff(true); return 'Claude isn’t available on this page for you.'; }
    if (code === 'rate_limited') return 'Claude is busy, or you reached a usage limit. Try again in a minute.';
    if (code === 'invalid_json') return 'Claude couldn’t read that clearly. Try again, or fill in the form yourself.';
    if (code === 'refused') return 'Claude declined this request. Change the text and try again.';
    if (code === 'session_expired') return 'Sign in to Claude again to use this.';
    if (code === 'prompt_too_large') return 'That text is too long. Paste just the message.';
    if (code === 'empty_completion') return 'Claude didn’t write anything. Try again.';
    return 'Something went wrong. Try again.';
  };

  const openDrawer = (d) => setDrawer(d);
  const openItem = (it) => {
    if (it.kind === 'task') openDrawer({ type: 'task', id: it.id });
    else if (it.kind === 'lead') openDrawer({ type: 'lead', id: it.id });
    else if (it.kind === 'invoice') openDrawer({ type: 'invoice', id: it.id });
    else if (it.kind === 'results') { go('client-' + it.id); openDrawer({ type: 'result', clientId: it.id, month: addMonths(thisMonth(), -1) }); }
    else if (it.kind === 'growth') openDrawer({ type: 'growth', month: it.id });
  };

  useEffect(() => {
    const onKey = (e) => {
      if ((e.metaKey || e.ctrlKey) && String(e.key).toLowerCase() === 'k') { e.preventDefault(); if (!drawerRef.current) setPalette((p) => !p); }
      else if (e.key === '/' && !isTyping(e.target) && !e.metaKey && !e.ctrlKey && !e.altKey && !drawerRef.current) { e.preventDefault(); setPalette(true); }
    };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, []);
  useEffect(() => {
    try { window.scrollTo(0, 0); } catch (e) { /* ignore */ }
    const nav = document.querySelector('.mnav'), a = nav && nav.querySelector('[aria-current="page"]');
    if (nav && a) nav.scrollLeft = Math.max(0, a.offsetLeft - (nav.clientWidth - a.offsetWidth) / 2);
  }, [route.view, route.id]);

  const counts = {
    leads: D.leads.filter((l) => l.stage === 'new').length,
    tasks: D.tasks.filter((k) => k.status !== 'done' && k.due && k.due <= today()).length,
    money: D.invoices.filter((i) => invoiceState(i) === 'overdue').length,
  };
  const ctx = {
    D, real, realTotal, realClients: real.clients, demo, demoPref, setDemoPref, noRuntime, db, user: caps.user, downloads: caps.downloads,
    me, readOnly, canCreate, canEditRecord, personName, clientName, openDrawer, openItem, actions, ai, aiError, openPalette: () => setPalette(true),
  };
  const isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent || '');
  const navActive = (k) => route.view === k || (k === 'clients' && route.view === 'client');
  let view = null;
  if (route.view === 'overview') view = html`<${Overview}/>`;
  else if (route.view === 'leads') view = html`<${Leads}/>`;
  else if (route.view === 'clients') view = html`<${Clients}/>`;
  else if (route.view === 'client') view = html`<${ClientDetail} id=${route.id}/>`;
  else if (route.view === 'tasks') view = html`<${Tasks}/>`;
  else if (route.view === 'money') view = html`<${Money}/>`;
  else if (route.view === 'growth') view = html`<${Growth}/>`;
  else if (route.view === 'setup') view = html`<${Setup}/>`;

  return html`<${Ctx.Provider} value=${ctx}>
    <div className="app">
      <aside className="side" aria-label="North Frame HQ">
        <a className="brand" href="#overview" aria-label="North Frame HQ overview"><span className="tile"><svg viewBox="0 0 156 88" aria-hidden="true"><use href="#logo-nf"/></svg></span><span className="brand-t"><span className="brand-n">North Frame</span><span className="lab">Headquarters</span></span></a>
        <nav className="nav" aria-label="Sections">${NAV.map((n) => html`<a key=${n.key} href=${'#' + n.key} aria-current=${navActive(n.key) ? 'page' : null}><${Icon} n=${n.icon}/>${n.label}${counts[n.key] ? html`<span className="count" aria-label=${counts[n.key] + ' need attention'}>${counts[n.key]}</span>` : null}</a>`)}</nav>
        <div className="side-foot">
          <button type="button" className="btn ghost sm" onClick=${() => setPalette(true)}><${Icon} n="i-search"/>Search<span className="kbd">${isMac ? '⌘K' : 'Ctrl K'}</span></button>
          ${me && me.id ? html`<div className="who"><${Avatar} id=${me.id} size=${30}/><span className="who-n">${me.name || 'You'}</span></div>` : null}
        </div>
      </aside>
      <div className="main">
        <header className="mhead">
          <div className="mhead-in">
            <a className="brand" href="#overview" aria-label="North Frame HQ overview"><span className="tile sm"><svg viewBox="0 0 156 88" aria-hidden="true"><use href="#logo-nf"/></svg></span><span className="brand-n">North Frame HQ</span></a>
            <${Btn} kind="sq" size="sm" aria-label="Search" onClick=${() => setPalette(true)}><${Icon} n="i-search"/><//>
          </div>
          <nav className="mnav" aria-label="Sections">${NAV.map((n) => html`<a key=${n.key} href=${'#' + n.key} aria-current=${navActive(n.key) ? 'page' : null}>${n.label}${counts[n.key] ? html`<span className="count">${counts[n.key]}</span>` : null}</a>`)}</nav>
        </header>
        <main className="wrap" id="main">
          ${booting ? html`<div aria-busy="true" style=${{ display: 'flex', flexDirection: 'column', gap: '22px' }}>
              <div className="vh"><div className="vh-t"><span className="lab">Loading leads, clients, tasks and numbers</span><h1 className="disp vh-h">North Frame HQ</h1></div></div>
              <div className="kpis">${[0, 1, 2, 3, 4, 5].map((i) => html`<div key=${i} className="skel"></div>`)}</div>
              <div className="split"><div className="skel" style=${{ minHeight: '260px' }}></div><div className="skel" style=${{ minHeight: '260px' }}></div></div>
            </div>`
          : html`<${Fragment}>
              ${demo ? html`<div className="banner inv" role="note">
                  <span className="sticker">Sample data</span>
                  <p>${noRuntime ? 'This preview shows sample records. Open the dashboard in Claude to use your live data.' : readOnly ? 'You have view-only access, so you see sample records instead of the team’s. Ask the owner for edit access to see and change real records.' : 'These are sample records that show how everything works. They aren’t saved, and they disappear when you add your first real lead, client or task.'}</p>
                  ${!noRuntime && !readOnly ? html`<${Btn} kind="ghost" size="sm" onClick=${() => { setDemoPref('off'); toast('Sample data hidden'); }}>Start empty<//>` : null}
                </div>` : null}
              ${readOnly && !demo ? html`<div className="banner line" role="note"><p><b>View only.</b> You can look around but not change records. Ask the owner for edit access.</p></div>` : null}
              ${(st.failed || stalled) && !demo ? html`<div className="banner line" role="status"><p>${st.failed ? 'Some records couldn’t load. Reload the page to try again.' : 'Some records are still loading. They appear here as soon as they arrive.'}</p></div>` : null}
              <${ErrorBoundary} key=${route.view + (route.id || '')}>${view}<//>
            <//>`}
        </main>
      </div>
    </div>
    ${drawer ? html`<${DrawerHost} d=${drawer} onClose=${() => setDrawer(null)}/>` : null}
    ${palette ? html`<${Palette} onClose=${() => setPalette(false)}/>` : null}
    <div className="toasts" role="status" aria-live="polite">${toasts.map((t) => html`<div key=${t.id} className="toast inv"><span>${t.text}</span>${(t.actions || []).map((a) => html`<button key=${a.label} type="button" className="btn ghost" onClick=${() => { dismiss(t.id); a.run(); }}>${a.label}</button>`)}</div>`)}</div>
  <//>`;
}

ReactDOM.createRoot(rootEl).render(html`<${App}/>`);
})();
</script>
